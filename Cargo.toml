[package]
name = "algebra_linear"
version = "1.1.1"
edition = "2024"
license = "BSD-3-Clause"
description = "Pure-Rust BLAS, LAPACK, and sparse LU"
homepage = "https://github.com/cpmech/algebra_linear"
repository = "https://github.com/cpmech/algebra_linear"
documentation = "https://docs.rs/algebra_linear"
readme = "README.md"
categories = ["mathematics", "science"]
keywords = ["blas", "lapack", "linear-algebra", "matrix"]
# Process files stay out of the published crate: code, README, LICENSE and the
# reference harness are what a user needs.
exclude = ["AGENTS.md", ".github/", ".gitignore", "rustfmt.toml", "zscripts/"]

# The reference-LAPACK parity harness. Development only: `build.rs` links a
# locally built LAPACK 3.12.1 and the tests compare the kernels against it.
# `ALGEBRA_LINEAR_DEV_LAPACK_ROOT` points at a CMake build directory that holds
# `include/` and `lib/`. Not for release.
#
#     ALGEBRA_LINEAR_DEV_LAPACK_ROOT=/path/to/lapack/build \
#       cargo test --features dev_lapack
[features]
dev_lapack = []

[package.metadata.docs.rs]
# The `dev_lapack` harness cannot build without a local LAPACK, and docs.rs has
# none: never let a docs build enable it.
all-features = false

[dependencies]
num-complex = "0.4"

[build-dependencies]
cc = "1"

[lints.clippy]
approx_constant = "allow"        # allow large constants; e.g. for OEIS reference
bool_assert_comparison = "allow" # allow "assert_eq!(x, true)" for better diagnostics
collapsible_if = "allow"         # allow nested "if" for readability
excessive_precision = "allow"    # allow large constants; e.g. for OEIS reference
identity_op = "allow"            # allow "i + 0" for uniform unrolled loops
let_unit_value = "allow"         # allow "let _ = CONST;" to force const evaluation
manual_is_multiple_of = "allow"  # allow "n % k == 0" instead of is_multiple_of()
manual_range_contains = "allow"  # allow if "a < b && c < d" constructions
needless_range_loop = "allow"    # allow "for i in a..b" instead of range
new_without_default = "allow"    # The user is encouraged to call new()
too_many_arguments = "allow"     # allow functions with many parameters
type_complexity = "allow"        # allow deeply nested array types (index maps)

# The sparse timing code uses `Instant`; the browser target has no
# `std::time::Instant`, so map it to `performance.now()`.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
web-time = "1"

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dev-dependencies]
wasm-bindgen-test = "0.3"
