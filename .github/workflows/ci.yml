name: CI
# The default build is the one that must always work: pure Rust, no external
# library, any target. The reference-parity harness (`dev_lapack`) needs a locally
# built LAPACK and is therefore a local command, not a job here — see README.
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      # Clippy is deliberately not a CI step: its lint set moves with the toolchain,
      # so a new stable can fail the build on style the transcription inherits from
      # LAPACK (1.99's `needless_late_init` on a declaration the reference makes at
      # the top of a block is the case in point). It stays a review requirement --
      # see AGENTS.md.
      - name: Format
        run: cargo fmt --all -- --check
      - name: Standalone -- no path dependencies
        run: |
          # This crate stands alone: it may not depend on a local checkout of a
          # project that consumes it.
          if grep -nE '^[a-z_]+ *= *\{[^}]*path *=' Cargo.toml; then
            echo "::error::a path dependency was added; this crate must not depend on a local checkout"
            exit 1
          fi
      - name: Test
        run: cargo test --lib

  wasm:
    runs-on: ubuntu-latest
    env:
      RUST_BACKTRACE: 1
      CARGO_TARGET_WASM32_WASIP1_RUNNER: wasmtime
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,wasm32-wasip1
      - name: Install wasmtime
        run: |
          curl -sSf https://wasmtime.dev/install.sh | bash
          echo "$HOME/.wasmtime/bin" >> "$GITHUB_PATH"
      - name: Build for wasm32-unknown-unknown
        run: cargo build --lib --target wasm32-unknown-unknown
      - name: Run the tests on wasm (generic kernel, no SIMD requirement)
        run: cargo test --lib --target wasm32-wasip1

  coverage:
    runs-on: ubuntu-latest
    env:
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview
      - name: Install cargo-llvm-cov
        run: |
          curl -LsSf https://github.com/taiki-e/cargo-llvm-cov/releases/latest/download/cargo-llvm-cov-x86_64-unknown-linux-gnu.tar.gz | tar xzf - -C ~/.cargo/bin
      - name: Generate code coverage
        run: |
          cargo llvm-cov --lib --lcov --output-path lcov.info
      # The threshold is applied to the DA records of the lcov file, not with
      # `--fail-under-lines`: llvm-cov's own summary counts a line once per
      # monomorphization, which reports dimension-dispatching code as partly
      # uncovered. See zscripts/check-coverage.bash.
      #
      # The bar sits below the 95 the rest of the dense-algebra stack holds itself
      # to because what remains uncovered here is refusal and rescue code that a
      # correct routine cannot reach -- the files and the reasons are recorded in
      # AGENTS.md. The two points of headroom absorb inlining and region-boundary
      # noise, which move the ratio without any test changing.
      - name: Check line coverage
        run: |
          bash zscripts/check-coverage.bash lcov.info 92
